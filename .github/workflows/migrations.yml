name: Push Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

# Never run two migration pushes against production at the same time
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Add required reviewers to this environment in repo settings to gate prod DB pushes
    environment: supabase-production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0

      - name: Push migrations to production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          max_attempts=3
          attempt=1
          wait_time=5

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."

            if supabase db push --db-url "$SUPABASE_DB_URL"; then
              echo "Migration successful!"
              exit 0
            fi

            if [ $attempt -lt $max_attempts ]; then
              echo "Attempt $attempt failed. Waiting ${wait_time}s before retry..."
              sleep $wait_time
              wait_time=$((wait_time * 2))  # Exponential backoff: 5s, 10s, 20s
            fi

            attempt=$((attempt + 1))
          done

          echo "All $max_attempts attempts failed"
          exit 1
