name: Push Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Repair orphaned migration versions
        run: |
          # Mark orphaned versions as reverted (versions in remote but not in local files)
          # This handles cases where migrations were renamed or combined
          supabase migration repair --status reverted 20251221 --db-url "${{ secrets.SUPABASE_DB_URL }}" 2>/dev/null || true

      - name: Push migrations to production
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
