name: Generate Demo Images

on:
  # Manual trigger
  workflow_dispatch:
  # Trigger when script changes
  push:
    branches: [main]
    paths:
      - 'scripts/generate-demo-images.ts'
      - '.github/workflows/demo-images.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    # Only run if OPENROUTER_IMAGE_MODEL is set (indicates image generation is enabled)
    if: ${{ vars.OPENROUTER_IMAGE_MODEL != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate demo images
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ vars.OPENROUTER_IMAGE_MODEL }}
        run: npx tsx scripts/generate-demo-images.ts

      - name: Check for new images
        id: check_changes
        run: |
          if git diff --quiet public/demo/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push images
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/demo/
          git commit -m "chore: generate demo images [skip ci]"
          git push
