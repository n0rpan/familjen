name: CI

# Deterministic checks only - no LLM calls and no secrets.
# AI review runs in the agent harness (Claude Code), not in CI.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Increase Node memory for TypeScript/Next.js builds
  NODE_OPTIONS: '--max-old-space-size=6144'

jobs:
  lint-typecheck:
    name: 🔍 Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      # Fail on high/critical advisories in production dependencies
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build-e2e:
    name: Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-typecheck]
    env:
      # Placeholder public config - E2E uses demo mode and mock auth, never a real backend
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start server
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          cat next.log
          exit 1

      # Non-blocking until the pre-existing failures in these specs are fixed
      # (15 tests fail identically on main against a local build).
      - name: Run E2E tests
        continue-on-error: true
        run: |
          npx playwright test \
            tests/e2e/design-system.spec.ts \
            tests/e2e/language-detection.spec.ts \
            tests/e2e/critical-journeys.spec.ts \
            --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for dangerous SQL patterns
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "✓ No migration files to validate"
            exit 0
          fi
          echo "✓ Found ${#files[@]} migration files"

          for file in "${files[@]}"; do
            if grep -qiP '^\s*DROP\s+(TABLE|INDEX|FUNCTION|TRIGGER)\s+(?!IF\s+EXISTS)' "$file"; then
              echo "::warning file=$file::DROP without IF EXISTS"
            fi
            if grep -qiP '^\s*(DELETE\s+FROM|TRUNCATE)\s+\w+\s*;' "$file"; then
              echo "::warning file=$file::DELETE/TRUNCATE without WHERE clause"
            fi
          done

          echo "✓ Migration validation complete"
