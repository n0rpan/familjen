  # ============================================
  # AI Visual Validation (No Baselines Needed)
  # ============================================
  visual-validation:
    name: AI Visual Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, smart-selector]
    # Run if: selector says run OR selector skipped it (let supervisor override)
    if: |
      github.event_name == 'pull_request' &&
      (needs.smart-selector.outputs.run_visual == 'true' || needs.smart-selector.outputs.run_visual == '')
    # Visual validation is advisory, not blocking. Reasons:
    # 1. New features may intentionally change UI (not a regression)
    # 2. AI vision models can have false positives
    # 3. Design decisions should be made by humans, AI just flags concerns
    # The PR comment will show issues for human review
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Get Vercel Preview URL
        id: vercel
        uses: zentered/vercel-preview-url@v1.1.9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Wait and retry if Vercel not ready
        id: vercel-wait
        if: steps.vercel.outputs.preview_url == ''
        run: |
          echo "⏳ Vercel preview not ready, waiting 30s and retrying..."
          sleep 30

      - name: Retry Get Vercel Preview URL
        id: vercel-retry
        if: steps.vercel.outputs.preview_url == ''
        uses: zentered/vercel-preview-url@v1.1.9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Set preview URL output
        id: preview
        run: |
          URL="${{ steps.vercel.outputs.preview_url || steps.vercel-retry.outputs.preview_url }}"
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: https://$URL"

      - name: Capture screenshots with mock data
        if: steps.preview.outputs.preview_url
        run: npx playwright test tests/e2e/capture-screenshots.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.preview.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Must match real Supabase URL so mock auth cookies have correct name
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Run AI visual validation
        if: steps.preview.outputs.preview_url
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_VISION_MODEL" ]; then
            echo "❌ OPENROUTER_VISION_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/ai-visual-validation.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VISION_MODEL: ${{ secrets.OPENROUTER_VISION_MODEL }}

      - name: Write skipped status if no preview URL
        if: steps.preview.outputs.preview_url == ''
        run: |
          echo '{"reviewer":"visual-validation","status":"skipped","verdict":"PASS","confidence":100,"findings":[],"summary":"No Vercel preview URL available.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/visual-validation.json

      - name: Write fallback status if no visual validation
        if: always()
        run: |
          if [ ! -f "ai-reviews/visual-validation.json" ]; then
            echo '{"reviewer":"visual-validation","status":"failed","verdict":"ERROR","confidence":0,"findings":[{"severity":"critical","category":"runtime-error","message":"Visual validation script did not produce output"}],"summary":"Visual validation failed to run. Check CI logs.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/visual-validation.json
          fi

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-visual
          path: ai-reviews/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload visual validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-validation
          path: |
            visual-validation-report.json
            visual-validation-comment.md
            tests/visual/current/
          retention-days: 7

      - name: Post visual validation comment
        if: always() && steps.preview.outputs.preview_url
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('visual-validation-comment.md')) {
              console.log('No visual validation comment to post')
              return
            }

            const comment = fs.readFileSync('visual-validation-comment.md', 'utf8')

            // Check for existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('AI Visual Validation')
            )

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              })
            }

  # ============================================
  # E2E Tests on Vercel Preview (PRs only)
  # ============================================
  e2e-preview:
    name: E2E Tests (Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, smart-selector]
    # Run if: selector says run OR let supervisor decide
    if: |
      github.event_name == 'pull_request' &&
      (needs.smart-selector.outputs.run_e2e == 'true' || needs.smart-selector.outputs.run_e2e == '')
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for PR diff comparison

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Get Vercel Preview URL
        id: vercel
        uses: zentered/vercel-preview-url@v1.1.9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Wait and retry if Vercel not ready
        if: steps.vercel.outputs.preview_url == ''
        run: |
          echo "⏳ Vercel preview not ready, waiting 30s and retrying..."
          sleep 30

      - name: Retry Get Vercel Preview URL
        id: vercel-retry
        if: steps.vercel.outputs.preview_url == ''
        uses: zentered/vercel-preview-url@v1.1.9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Set preview URL output
        id: preview
        run: |
          URL="${{ steps.vercel.outputs.preview_url || steps.vercel-retry.outputs.preview_url }}"
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: https://$URL"

      - name: Generate PR-specific test scenarios
        id: generate-tests
        if: steps.preview.outputs.preview_url
        continue-on-error: true
        run: npx tsx scripts/ai-pr-test-generator.ts --base origin/${{ github.base_ref }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Run E2E tests against preview
        id: e2e-tests
        if: steps.preview.outputs.preview_url
        continue-on-error: true  # Test failures shouldn't show job as red
        run: |
          # Run design system tests
          npx playwright test tests/e2e/design-system.spec.ts --project=chromium
          # Run language detection tests (Norwegian, English, Swedish)
          npx playwright test tests/e2e/language-detection.spec.ts --project=chromium
          # Run PR-specific generated tests (if they exist)
          if [ -f "tests/e2e/generated/pr-scenarios.json" ]; then
            echo "🤖 Running AI-generated PR-specific tests..."
            npx playwright test tests/e2e/pr-scenarios.spec.ts --project=chromium || true
          fi
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.preview.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Required for mock auth to create correct cookie name
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Capture screenshots from preview
        if: steps.preview.outputs.preview_url
        run: npx playwright test tests/e2e/capture-screenshots.spec.ts --project=chromium || true
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.preview.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Generate E2E test report
        if: always()
        run: |
          # Convert Playwright results to review format
          npx tsx scripts/e2e-test-reporter.ts || true
        continue-on-error: true

      - name: Write fallback status if no e2e report
        if: always()
        run: |
          if [ ! -f "ai-reviews/e2e-tests.json" ]; then
            echo '{"reviewer":"e2e-tests","status":"skipped","verdict":"PASS","confidence":100,"findings":[],"summary":"E2E test reporter did not generate output.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/e2e-tests.json
          fi

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-e2e
          path: ai-reviews/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-preview-results
          path: |
            playwright-report/
            tests/visual/current/
            tests/e2e/generated/
          retention-days: 7

      - name: Post preview URL comment
        if: steps.preview.outputs.preview_url
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://${{ steps.preview.outputs.preview_url }}';
            const testOutcome = '${{ steps.e2e-tests.outcome }}';
            const testStatus = testOutcome === 'success'
              ? '✅ E2E tests passed'
              : testOutcome === 'failure'
                ? '⚠️ E2E tests had issues (see Final Verdict for details)'
                : '⏭️ E2E tests skipped';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );

            const body = '## 🔗 Preview Deployment\n\n' +
              '**URL:** ' + url + '\n\n' +
              '**Status:** ' + testStatus + '\n\n' +
              '---\n*Tested automatically by CI*';

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # ============================================
  # API integration tests (PRs and main)
  # NON-BLOCKING: Final verdict decides if this blocks
  # ============================================
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, smart-selector]
    # Run if: PR and selector says run, OR push to main (protection)
    # smart-selector only runs on PRs, but we need it in needs to access outputs
    # On main, smart-selector is skipped so outputs are empty, but we hit the push condition
    if: |
      always() &&
      needs.unit-tests.result == 'success' &&
      (
        (github.event_name == 'pull_request' &&
         needs.smart-selector.outputs.run_api != 'false') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      - name: Install dependencies
        run: npm ci

      - name: Check API key availability
        id: check-secrets
        run: |
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "has_api_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_api_key=false" >> $GITHUB_OUTPUT
            echo "⚠️ OPENROUTER_API_KEY not set - skipping API tests"
            # Write skipped status
            echo '{"reviewer":"api-tests","status":"skipped","verdict":"PASS","confidence":100,"findings":[],"summary":"API key not available.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/api-tests.json
          fi

      - name: Run API integration tests
        if: steps.check-secrets.outputs.has_api_key == 'true'
        run: npm run test:api -- --reporter=json --outputFile=api-test-results.json || true
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_TEST_MODEL: ${{ secrets.OPENROUTER_TEST_MODEL }}
          TEST_API_DELAY_MS: '500'

      - name: Generate API test report
        if: steps.check-secrets.outputs.has_api_key == 'true'
        run: npx tsx scripts/api-test-reporter.ts || true
        continue-on-error: true

      - name: Write fallback status if no api report
        if: always()
        run: |
          if [ ! -f "ai-reviews/api-tests.json" ]; then
            echo '{"reviewer":"api-tests","status":"skipped","verdict":"PASS","confidence":100,"findings":[],"summary":"API test reporter did not generate output.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/api-tests.json
          fi

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-api
          path: ai-reviews/
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # SQL Migration Validation
  # ============================================
  migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check SQL files exist
        run: |
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "✓ Found $(ls supabase/migrations/*.sql | wc -l) migration files"
          else
            echo "✓ No migration files to validate"
            exit 0
          fi

      - name: Validate SQL syntax
        run: |
          errors=0
          for file in supabase/migrations/*.sql; do
            if [ -f "$file" ]; then
              echo "Checking $file..."

              # Check for common dangerous patterns without IF EXISTS
              if grep -qiE "^\s*DROP\s+(TABLE|INDEX|FUNCTION|TRIGGER)\s+(?!IF\s+EXISTS)" "$file" 2>/dev/null; then
                echo "⚠️  Warning: $file has DROP without IF EXISTS"
              fi

              # Check for DELETE/TRUNCATE without WHERE (potential data loss)
              if grep -qiE "^\s*(DELETE\s+FROM|TRUNCATE)\s+\w+\s*;" "$file" 2>/dev/null; then
                echo "⚠️  Warning: $file has DELETE/TRUNCATE without WHERE clause"
              fi
            fi
          done

          echo "✓ Migration validation complete"

  # ============================================
  # PRE-VERDICT CHECK - Fast LLM pass before expensive supervisor
  # Reviews selector decisions, runs quick checks, gathers context
  # ============================================
  pre-verdict-check:
    name: 🔍 Pre-Verdict Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [smart-selector, unit-tests]
    if: github.event_name == 'pull_request'
    continue-on-error: true  # Non-blocking - just provides context

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download test selection
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-selection
          path: ci-state/

      - name: Run pre-verdict check
        run: npx tsx scripts/ai-pre-verdict-check.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}
          # Note: Preview URL not available here - runs in parallel with e2e-preview

      - name: Upload pre-verdict results
        uses: actions/upload-artifact@v4
        with:
          name: pre-verdict-check
          path: ci-state/pre-verdict-check.json
          retention-days: 7

  # ============================================
  # FINAL VERDICT - The only job that can block PRs
  # ============================================
  final-verdict:
    name: 🎯 Final AI Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [migration-review, ai-code-review, security-review, pr-quality, dependency-review, visual-validation, e2e-preview, api-tests, pre-verdict-check]
    if: github.event_name == 'pull_request' && always()
    # This job CAN fail and will block the PR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Install Playwright browsers (needed if supervisor decides to run visual/e2e tests)
      # Uses cache to avoid re-downloading on every run (~1.5 min savings)
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version // empty')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Download test selection from smart-selector (for supervisor tools)
      - name: Download test selection
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-selection
          path: ci-state/

      # Download pre-verdict check results (fast LLM preliminary analysis)
      - name: Download pre-verdict check
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pre-verdict-check
          path: ci-state/

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      # Download all review artifacts using pattern matching
      - name: Download all review artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ai-reviews-*
          path: ai-reviews-temp/
          merge-multiple: false

      # Flatten the directory structure (artifacts download to subdirectories)
      - name: Consolidate review artifacts
        run: |
          echo "📦 Consolidating review artifacts..."
          echo ""
          echo "🔍 Debug: Contents of ai-reviews-temp/"
          ls -laR ai-reviews-temp/ 2>/dev/null || echo "   (directory does not exist)"
          echo ""
          if [ -d "ai-reviews-temp" ]; then
            # Each artifact downloads to its own subdirectory, flatten them
            find ai-reviews-temp -name "*.json" -exec cp {} ai-reviews/ \; 2>/dev/null || true
            echo "📄 Found review files in ai-reviews/:"
            ls -la ai-reviews/ || echo "No review files found"
            echo ""
            echo "📄 Content preview of each file:"
            for f in ai-reviews/*.json; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                head -c 200 "$f"
                echo ""
              fi
            done
          else
            echo "⚠️ No review artifacts downloaded (ai-reviews-temp does not exist)"
          fi

      - name: Get Vercel Preview URL
        id: vercel
        uses: zentered/vercel-preview-url@v1.1.9
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run final verdict
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_VERDICT_MODEL" ]; then
            echo "❌ OPENROUTER_VERDICT_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/ai-final-verdict.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VERDICT_MODEL: ${{ secrets.OPENROUTER_VERDICT_MODEL }}
          OPENROUTER_VISION_MODEL: ${{ secrets.OPENROUTER_VISION_MODEL }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}
          OPENROUTER_TEST_MODEL: ${{ secrets.OPENROUTER_TEST_MODEL }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
          VERCEL_PREVIEW_URL: https://${{ steps.vercel.outputs.preview_url }}

      - name: Upload final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-verdict
          path: |
            ai-reviews/final-verdict.json
            final-verdict-comment.md
            pre-existing-issues-comment.md
          retention-days: 7

      - name: Post final verdict comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('final-verdict-comment.md')) {
              console.log('No final verdict comment to post')
              return
            }

            const comment = fs.readFileSync('final-verdict-comment.md', 'utf8')

            // Check for existing bot comment (look for AI Review marker)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && (c.body.includes('AI Review:') || c.body.includes('Final AI Verdict'))
            )

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              })
            }

      - name: Post pre-existing issues comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('pre-existing-issues-comment.md')) {
              console.log('No pre-existing issues to report')
              return
            }

            const comment = fs.readFileSync('pre-existing-issues-comment.md', 'utf8')

            // Check for existing pre-existing issues comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Pre-existing Issues (Not from this PR)')
            )

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              })
            }

      - name: Send verdict webhook
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let verdict = 'ERROR'
            let summary = 'Verdict not available'
            let cost = 0

            try {
              if (fs.existsSync('ai-reviews/final-verdict.json')) {
                const data = JSON.parse(fs.readFileSync('ai-reviews/final-verdict.json', 'utf8'))
                verdict = data.verdict || 'ERROR'
                summary = data.summary || 'No summary available'
                cost = data.total_cost_usd || 0
              }
            } catch (e) {
              console.log('Could not read verdict:', e.message)
            }

            const webhookUrl = process.env.CI_WEBHOOK_URL
            if (!webhookUrl) {
              console.log('CI_WEBHOOK_URL not set, skipping webhook')
              return
            }

            const payload = {
              type: 'verdict',
              pr_number: context.issue.number,
              pr_title: context.payload.pull_request?.title || 'Unknown',
              timestamp: new Date().toISOString(),
              data: {
                verdict,
                cost_usd: cost,
                summary
              }
            }

            try {
              const response = await fetch(webhookUrl + '/api/ci/webhook', {
                method: 'POST',
                redirect: 'error', // Don't follow redirects - security risk to pass credentials to different host
                headers: {
                  'Content-Type': 'application/json',
                  'x-ci-secret': process.env.CI_WEBHOOK_SECRET || ''
                },
                body: JSON.stringify(payload)
              })
              console.log('Webhook response:', response.status)
            } catch (e) {
              // Log detailed error for debugging redirect issues
              console.log('Webhook failed:', e.message)
              if (e.message.includes('redirect')) {
                console.log('Hint: Check CI_WEBHOOK_URL - it may be causing a redirect. Use the final URL directly.')
              }
            }
        env:
          CI_WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
          CI_WEBHOOK_SECRET: ${{ secrets.CI_WEBHOOK_SECRET }}
