name: AI-Powered CI

on:
  push:
    branches: [main, develop, 'claude/**', 'feature/**', 'fix/**']
  pull_request:
    # Run on all PRs to catch issues early
    types: [opened, synchronize, reopened]

# Required for posting PR comments
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Increase Node memory for TypeScript/Next.js builds
  NODE_OPTIONS: '--max-old-space-size=6144'

jobs:
  # ============================================
  # ACTIVITY PULSE - Super fast, runs on ALL commits
  # Sends live activity to dashboard, provides context for AI agents
  # ============================================
  activity-pulse:
    name: ⚡ Activity Pulse
    runs-on: ubuntu-latest
    timeout-minutes: 1
    # Run on everything - PRs and pushes to any branch
    if: always()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10  # Just recent history for speed

      - name: Analyze activity and send pulse
        id: pulse
        run: |
          echo "⚡ Activity Pulse - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""

          # Extract branch info
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "📍 Branch: $BRANCH"

          # Detect work type from branch name
          WORK_TYPE="unknown"
          if [[ "$BRANCH" == claude/* ]]; then
            WORK_TYPE="ai-agent"
          elif [[ "$BRANCH" == feature/* ]]; then
            WORK_TYPE="feature"
          elif [[ "$BRANCH" == fix/* ]]; then
            WORK_TYPE="bugfix"
          elif [[ "$BRANCH" == "main" ]]; then
            WORK_TYPE="production"
          elif [[ "$BRANCH" == "develop" ]]; then
            WORK_TYPE="development"
          fi
          echo "🏷️  Work type: $WORK_TYPE"

          # Get recent commit info
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          echo "📝 Latest: $COMMIT_MSG"
          echo "👤 Author: $COMMIT_AUTHOR"

          # Analyze changed files (last commit)
          echo ""
          echo "📁 Changed areas:"
          AREAS=""

          # Count changes by area
          UI_CHANGES=$(git diff --name-only HEAD~1 2>/dev/null | grep -c "^src/components\|^src/app.*page\|\.tsx$" || echo "0")
          API_CHANGES=$(git diff --name-only HEAD~1 2>/dev/null | grep -c "^src/app/api\|route\.ts$" || echo "0")
          LIB_CHANGES=$(git diff --name-only HEAD~1 2>/dev/null | grep -c "^src/lib/" || echo "0")
          TEST_CHANGES=$(git diff --name-only HEAD~1 2>/dev/null | grep -c "^tests/\|\.test\." || echo "0")
          CI_CHANGES=$(git diff --name-only HEAD~1 2>/dev/null | grep -c "^\.github/\|^scripts/" || echo "0")
          DB_CHANGES=$(git diff --name-only HEAD~1 2>/dev/null | grep -c "^supabase/\|migration" || echo "0")

          [[ $UI_CHANGES -gt 0 ]] && AREAS="$AREAS ui($UI_CHANGES)"
          [[ $API_CHANGES -gt 0 ]] && AREAS="$AREAS api($API_CHANGES)"
          [[ $LIB_CHANGES -gt 0 ]] && AREAS="$AREAS lib($LIB_CHANGES)"
          [[ $TEST_CHANGES -gt 0 ]] && AREAS="$AREAS tests($TEST_CHANGES)"
          [[ $CI_CHANGES -gt 0 ]] && AREAS="$AREAS ci($CI_CHANGES)"
          [[ $DB_CHANGES -gt 0 ]] && AREAS="$AREAS db($DB_CHANGES)"

          echo "   $AREAS"

          # Generate tips for AI agents based on what's changed
          echo ""
          echo "💡 Tips for AI agents working on this branch:"

          if [[ $DB_CHANGES -gt 0 ]]; then
            echo "   • Database changes detected - remember RLS policies and SECURITY DEFINER"
            echo "   • Use IF EXISTS for DROP statements"
            echo "   • Check household_id scoping"
          fi

          if [[ $API_CHANGES -gt 0 ]]; then
            echo "   • API changes - use ApiErrors helper for Norwegian error messages"
            echo "   • Check rate limiting for expensive operations"
            echo "   • Validate auth with createClient() from @/lib/supabase/server"
          fi

          if [[ $UI_CHANGES -gt 0 ]]; then
            echo "   • UI changes - use useLanguage() for i18n, not hardcoded strings"
            echo "   • Check demo mode compatibility (useDataSource hook)"
            echo "   • Touch targets should be 44px+ for mobile"
          fi

          if [[ $TEST_CHANGES -gt 0 ]]; then
            echo "   • Test changes - run 'npm run test:run' to verify"
            echo "   • Integration tests need mocked Supabase client"
          fi

          if [[ $CI_CHANGES -gt 0 ]]; then
            echo "   • CI changes - test locally with 'npx tsx scripts/...'"
            echo "   • Reviewers should exit 0 (non-blocking), final-verdict decides"
          fi

          # Count total lines changed
          LINES_ADDED=$(git diff --shortstat HEAD~1 2>/dev/null | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo "0")
          LINES_REMOVED=$(git diff --shortstat HEAD~1 2>/dev/null | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo "0")

          echo ""
          echo "📊 Stats: +$LINES_ADDED -$LINES_REMOVED lines"

          # Set outputs for webhook
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "work_type=$WORK_TYPE" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "areas=$AREAS" >> $GITHUB_OUTPUT
          echo "lines_added=$LINES_ADDED" >> $GITHUB_OUTPUT
          echo "lines_removed=$LINES_REMOVED" >> $GITHUB_OUTPUT

      - name: Send activity pulse to dashboard
        if: always()
        continue-on-error: true
        run: |
          # Skip if no webhook URL configured
          if [ -z "${{ secrets.CI_WEBHOOK_URL }}" ]; then
            echo "CI_WEBHOOK_URL not set, skipping webhook"
            exit 0
          fi

          curl -X POST --max-redirs 0 -s -w "\nHTTP_STATUS: %{http_code}\n" \
            "${{ secrets.CI_WEBHOOK_URL }}/api/ci/webhook" \
            -H "Content-Type: application/json" \
            -H "x-ci-secret: ${{ secrets.CI_WEBHOOK_SECRET }}" \
            -d '{
              "type": "activity_pulse",
              "pr_number": ${{ github.event.pull_request.number || 0 }},
              "pr_title": "${{ github.event.pull_request.title || github.event.head_commit.message }}",
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "data": {
                "branch": "${{ steps.pulse.outputs.branch }}",
                "work_type": "${{ steps.pulse.outputs.work_type }}",
                "commit_sha": "${{ github.sha }}",
                "commit_msg": "${{ steps.pulse.outputs.commit_msg }}",
                "areas": "${{ steps.pulse.outputs.areas }}",
                "lines_added": ${{ steps.pulse.outputs.lines_added || 0 }},
                "lines_removed": ${{ steps.pulse.outputs.lines_removed || 0 }},
                "actor": "${{ github.actor }}",
                "event": "${{ github.event_name }}"
              }
            }' 2>&1 || true

  # ============================================
  # SMART TEST SELECTOR (runs first, decides what to test)
  # ============================================
  smart-selector:
    name: 🧠 Smart Test Selector
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Only run selector on PRs (push to main always runs protection tests)
    if: github.event_name == 'pull_request'
    outputs:
      run_visual: ${{ steps.selector.outputs.run_visual_validation }}
      run_e2e: ${{ steps.selector.outputs.run_e2e_tests }}
      run_migration: ${{ steps.selector.outputs.run_migration_review }}
      run_api: ${{ steps.selector.outputs.run_api_tests }}
      run_code_review: ${{ steps.selector.outputs.run_code_review }}
      run_dependency: ${{ steps.selector.outputs.run_dependency_review }}
      run_security: ${{ steps.selector.outputs.run_security_review }}
      run_pr_quality: ${{ steps.selector.outputs.run_pr_quality }}
      suggested_labels: ${{ steps.labeler.outputs.labels }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Download previous PR state if exists
      - name: Download PR state artifact
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          workflow: ci.yml
          name: pr-state-${{ github.event.pull_request.number }}
          path: ci-state/
          search_artifacts: true

      - name: Run smart test selector
        id: selector
        run: npx tsx scripts/ai-test-selector.ts --base origin/${{ github.base_ref }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Run AI PR labeler
        id: labeler
        run: npx tsx scripts/ai-pr-labeler.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Apply suggested labels
        if: steps.labeler.outputs.labels != ''
        uses: actions/github-script@v7
        with:
          script: |
            const labels = '${{ steps.labeler.outputs.labels }}'.split(',').filter(l => l.trim())
            if (labels.length === 0) return

            console.log('Applying labels:', labels)
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels
              })
              console.log('✅ Labels applied successfully')
            } catch (error) {
              console.log('⚠️ Could not apply labels:', error.message)
            }

      - name: Send webhook for PR opened
        if: always()
        continue-on-error: true
        run: |
          # Debug: show the URL being called (without the secret value)
          echo "Calling webhook at: ${{ secrets.CI_WEBHOOK_URL }}/api/ci/webhook"

          # --max-redirs 0: Don't follow redirects - security risk to pass credentials to different host
          # -v: Verbose to stderr to see redirect Location header
          # -w: Write HTTP status code at the end
          curl -X POST --max-redirs 0 -v -w "\nHTTP_STATUS: %{http_code}\nREDIRECT_URL: %{redirect_url}\n" \
            "${{ secrets.CI_WEBHOOK_URL }}/api/ci/webhook" \
            -H "Content-Type: application/json" \
            -H "x-ci-secret: ${{ secrets.CI_WEBHOOK_SECRET }}" \
            -d '{
              "type": "review_started",
              "pr_number": ${{ github.event.pull_request.number }},
              "pr_title": "${{ github.event.pull_request.title }}",
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "data": {
                "labels": "${{ steps.labeler.outputs.labels }}"
              }
            }' 2>&1 || true

      - name: Upload PR state
        uses: actions/upload-artifact@v4
        with:
          name: pr-state-${{ github.event.pull_request.number }}
          path: ci-state/
          retention-days: 30

      - name: Upload test selection
        uses: actions/upload-artifact@v4
        with:
          name: test-selection
          path: ci-state/test-selection.json
          retention-days: 7

  # ============================================
  # MERGE CHECK - Skip CI if coming from green PR
  # ============================================
  merge-check:
    name: 🔍 Check Merge Status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      skip_ci: ${{ steps.check.outputs.skip_ci }}
      pr_number: ${{ steps.check.outputs.pr_number }}

    steps:
      - name: Check if from merged PR
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this push is from a merged PR
            // Handles: merge commits, squash merges, and rebase merges
            const commitMessage = context.payload.head_commit?.message || '';
            const commitSha = context.payload.head_commit?.id || '';

            // Check for force-run flag: [ci full] or [full ci] in commit message
            if (/\[(ci full|full ci)\]/i.test(commitMessage)) {
              console.log('Force-run flag detected: [ci full]');
              console.log('Running full CI suite regardless of PR status');
              core.setOutput('skip_ci', 'false');
              return;
            }

            // Pattern 1: Standard merge commit
            let prMatch = commitMessage.match(/Merge pull request #(\d+)/);

            // Pattern 2: Squash merge (PR title + number in parentheses)
            if (!prMatch) {
              prMatch = commitMessage.match(/\(#(\d+)\)$/m);
            }

            // Pattern 3: Check if commit is associated with a PR via GitHub API
            if (!prMatch && commitSha) {
              try {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: commitSha,
                });
                if (prs.length > 0 && prs[0].merged) {
                  prMatch = ['', prs[0].number.toString()];
                  console.log(`Found associated merged PR #${prs[0].number} via API`);
                }
              } catch (e) {
                console.log('Could not query associated PRs:', e.message);
              }
            }

            if (!prMatch) {
              console.log('Not a PR merge commit, running full CI');
              console.log('Commit message:', commitMessage.slice(0, 100));
              core.setOutput('skip_ci', 'false');
              return;
            }

            const prNumber = prMatch[1];
            core.setOutput('pr_number', prNumber);
            console.log(`Detected merge from PR #${prNumber}`);

            // Check if PR's CI passed
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: parseInt(prNumber),
              });

              // Get the final verdict check
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                check_name: '🎯 Final AI Verdict',
              });

              const verdictCheck = checks.check_runs[0];
              if (verdictCheck?.conclusion === 'success') {
                console.log('PR CI passed, skipping redundant checks');
                core.setOutput('skip_ci', 'true');
              } else {
                console.log('PR CI did not pass or verdict not found, running full CI');
                console.log('Verdict check:', JSON.stringify(verdictCheck, null, 2));
                core.setOutput('skip_ci', 'false');
              }
            } catch (error) {
              console.log('Could not check PR status:', error.message);
              core.setOutput('skip_ci', 'false');
            }

  # ============================================
  # STAGE 1: Fast checks (combined for efficiency)
  # ============================================
  lint-typecheck:
    name: 🔍 Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run lint and typecheck in parallel within same job
      # Fail fast if either fails (no point continuing)
      - name: Run ESLint and TypeScript in parallel
        run: |
          set -e
          npm run lint &
          LINT_PID=$!
          npx tsc --noEmit &
          TSC_PID=$!
          LINT_EXIT=0
          TSC_EXIT=0
          wait $LINT_PID || LINT_EXIT=$?
          wait $TSC_PID || TSC_EXIT=$?
          if [ $LINT_EXIT -ne 0 ]; then
            echo "❌ ESLint failed"
            exit $LINT_EXIT
          fi
          if [ $TSC_EXIT -ne 0 ]; then
            echo "❌ TypeScript check failed"
            exit $TSC_EXIT
          fi
          echo "✅ Lint and typecheck passed"

  # ============================================
  # STAGE 2: Unit tests (after lint/typecheck)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # NOTE: Build is done by Vercel - we rely on Vercel preview for build verification
  # This saves ~2min CI time since Vercel builds first anyway
  # ============================================

  # ============================================
  # AI Migration Review (for PRs with migrations)
  # NON-BLOCKING: Final verdict decides if this blocks
  # Uses smart selector output to determine if needed
  # ============================================
  migration-review:
    name: AI Migration Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typecheck, smart-selector]
    # Run if: selector says run OR selector didn't run (push to main) AND there are migrations
    if: |
      github.event_name == 'pull_request' &&
      (needs.smart-selector.outputs.run_migration == 'true' || needs.smart-selector.outputs.run_migration == '')
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check for migration changes
        id: check-migrations
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -c 'supabase/migrations/' || echo "0")
          echo "has_migrations=$([[ $CHANGED -gt 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "Found $CHANGED migration changes"

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      - name: Install dependencies
        if: steps.check-migrations.outputs.has_migrations == 'true'
        run: npm ci

      - name: Run AI migration review
        if: steps.check-migrations.outputs.has_migrations == 'true'
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_FAST_MODEL" ]; then
            echo "❌ OPENROUTER_FAST_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/migration-ai-review.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}

      - name: Write skipped status if no migrations
        if: steps.check-migrations.outputs.has_migrations != 'true'
        run: |
          echo '{"reviewer":"migration-review","status":"skipped","verdict":"PASS","confidence":100,"findings":[],"summary":"No migrations to review.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/migration-review.json

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-migration
          path: ai-reviews/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload legacy results
        if: steps.check-migrations.outputs.has_migrations == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: migration-review
          path: migration-review.json
          retention-days: 7

  # ============================================
  # AI Code Review
  # NON-BLOCKING: Final verdict decides if this blocks
  # ============================================
  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests]
    if: github.event_name == 'pull_request'
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      - name: Install dependencies
        run: npm ci

      - name: Run AI code review
        id: ai-review
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_FAST_MODEL" ]; then
            echo "❌ OPENROUTER_FAST_MODEL is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_CAPABLE_MODEL" ]; then
            echo "❌ OPENROUTER_CAPABLE_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/ai-code-review.ts --base origin/${{ github.base_ref }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}
          OPENROUTER_CAPABLE_MODEL: ${{ secrets.OPENROUTER_CAPABLE_MODEL }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Write fallback status if no code review
        if: always()
        run: |
          if [ ! -f "ai-reviews/code-review.json" ]; then
            echo '{"reviewer":"code-review","status":"failed","verdict":"ERROR","confidence":0,"findings":[{"severity":"critical","category":"runtime-error","message":"Code review script did not produce output"}],"summary":"Code review failed to run. Check CI logs.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/code-review.json
          fi

      - name: Debug - Show ai-reviews contents before upload
        if: always()
        run: |
          echo "📁 Contents of ai-reviews/ before upload:"
          ls -la ai-reviews/ || echo "(directory does not exist)"
          echo ""
          if [ -f "ai-reviews/code-review.json" ]; then
            echo "📄 code-review.json preview:"
            head -c 300 ai-reviews/code-review.json
          fi

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-code
          path: ai-reviews/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload legacy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-code-review
          path: |
            ai-review-result.json
            ai-review-comment.md
          retention-days: 7

      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('ai-review-comment.md')) {
              console.log('No review comment to post')
              return
            }

            const comment = fs.readFileSync('ai-review-comment.md', 'utf8')

            // Check for existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('AI Code Review')
            )

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              })
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              })
            }

  # ============================================
  # AI Security Review
  # NON-BLOCKING: Final verdict decides if this blocks
  # ============================================
  security-review:
    name: 🔒 AI Security Review
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [lint-typecheck, smart-selector]
    # Run if: selector says run OR selector output is empty (fallback to conservative)
    if: |
      github.event_name == 'pull_request' &&
      (needs.smart-selector.outputs.run_security == 'true' || needs.smart-selector.outputs.run_security == '')
    continue-on-error: true

    steps:
