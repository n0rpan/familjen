name: AI-Powered CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # Run on all PRs to catch issues early
    types: [opened, synchronize, reopened]

# Required for posting PR comments
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Increase Node memory for TypeScript/Next.js builds
  NODE_OPTIONS: '--max-old-space-size=6144'

jobs:
  # ============================================
  # STAGE 1: Fast checks (run in parallel)
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  # ============================================
  # STAGE 2: Unit tests (after lint/typecheck)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # STAGE 3: Build verification (after tests)
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Next.js build artifacts
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build application
        run: npm run build
        env:
          # Placeholder env vars for build (actual values in Vercel)
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder'

  # ============================================
  # AI Migration Review (for PRs with migrations)
  # NON-BLOCKING: Final verdict decides if this blocks
  # ============================================
  migration-review:
    name: AI Migration Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint]
    if: github.event_name == 'pull_request'
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check for migration changes
        id: check-migrations
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -c 'supabase/migrations/' || echo "0")
          echo "has_migrations=$([[ $CHANGED -gt 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "Found $CHANGED migration changes"

      - name: Install dependencies
        if: steps.check-migrations.outputs.has_migrations == 'true'
        run: npm ci

      - name: Run AI migration review
        if: steps.check-migrations.outputs.has_migrations == 'true'
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_FAST_MODEL" ]; then
            echo "❌ OPENROUTER_FAST_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/migration-ai-review.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-migration
          path: .ai-reviews/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload legacy results
        if: steps.check-migrations.outputs.has_migrations == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: migration-review
          path: migration-review.json
          retention-days: 7

  # ============================================
  # AI Code Review
  # NON-BLOCKING: Final verdict decides if this blocks
  # ============================================
  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests, build]
    if: github.event_name == 'pull_request'
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI code review
        id: ai-review
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_FAST_MODEL" ]; then
            echo "❌ OPENROUTER_FAST_MODEL is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_CAPABLE_MODEL" ]; then
            echo "❌ OPENROUTER_CAPABLE_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/ai-code-review.ts --base origin/${{ github.base_ref }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}
          OPENROUTER_CAPABLE_MODEL: ${{ secrets.OPENROUTER_CAPABLE_MODEL }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-code
          path: .ai-reviews/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload legacy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-code-review
          path: |
            ai-review-result.json
            ai-review-comment.md
          retention-days: 7

      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('ai-review-comment.md')) {
              console.log('No review comment to post')
              return
            }

            const comment = fs.readFileSync('ai-review-comment.md', 'utf8')

            // Check for existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('AI Code Review')
            )

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              })
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              })
            }

  # ============================================
  # AI Visual Validation (No Baselines Needed)
  # ============================================
  visual-validation:
    name: AI Visual Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: github.event_name == 'pull_request'
    # Visual validation is advisory, not blocking. Reasons:
    # 1. New features may intentionally change UI (not a regression)
    # 2. AI vision models can have false positives
    # 3. Design decisions should be made by humans, AI just flags concerns
    # The PR comment will show issues for human review
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Wait for Vercel to start
        run: sleep 30

      - name: Get Vercel Preview URL
        id: vercel
        uses: zentered/vercel-preview-url@v1.1.9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Log Preview URL
        run: |
          echo "Preview URL: https://${{ steps.vercel.outputs.preview_url }}"

      - name: Capture screenshots with mock data
        if: steps.vercel.outputs.preview_url
        run: npx playwright test tests/e2e/capture-screenshots.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.vercel.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Must match real Supabase URL so mock auth cookies have correct name
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Run AI visual validation
        if: steps.vercel.outputs.preview_url
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_VISION_MODEL" ]; then
            echo "❌ OPENROUTER_VISION_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/ai-visual-validation.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VISION_MODEL: ${{ secrets.OPENROUTER_VISION_MODEL }}

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-visual
          path: .ai-reviews/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload visual validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-validation
          path: |
            visual-validation-report.json
            visual-validation-comment.md
            tests/visual/current/
          retention-days: 7

      - name: Post visual validation comment
        if: always() && steps.vercel.outputs.preview_url
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('visual-validation-comment.md')) {
              console.log('No visual validation comment to post')
              return
            }

            const comment = fs.readFileSync('visual-validation-comment.md', 'utf8')

            // Check for existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('AI Visual Validation')
            )

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              })
            }

  # ============================================
  # E2E Tests on Vercel Preview (PRs only)
  # ============================================
  e2e-preview:
    name: E2E Tests (Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: github.event_name == 'pull_request'
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Wait for Vercel to start
        run: sleep 30

      - name: Get Vercel Preview URL
        id: vercel
        uses: zentered/vercel-preview-url@v1.1.9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Log Preview URL
        run: |
          echo "Preview URL: https://${{ steps.vercel.outputs.preview_url }}"

      - name: Run E2E tests against preview
        if: steps.vercel.outputs.preview_url
        run: |
          # Run design system tests
          npx playwright test tests/e2e/design-system.spec.ts --project=chromium
          # Run language detection tests (Norwegian, English, Swedish)
          npx playwright test tests/e2e/language-detection.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.vercel.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Required for mock auth to create correct cookie name
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Capture screenshots from preview
        if: steps.vercel.outputs.preview_url
        run: npx playwright test tests/e2e/capture-screenshots.spec.ts --project=chromium || true
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.vercel.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Generate E2E test report
        if: always()
        run: |
          # Convert Playwright results to review format
          npx tsx scripts/e2e-test-reporter.ts || true
        continue-on-error: true

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-e2e
          path: .ai-reviews/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-preview-results
          path: |
            playwright-report/
            tests/visual/current/
          retention-days: 7

      - name: Post preview URL comment
        if: steps.vercel.outputs.preview_url
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://${{ steps.vercel.outputs.preview_url }}';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );

            const body = '## 🔗 Preview Deployment\n\n' +
              '**URL:** ' + url + '\n\n' +
              '**E2E Tests:** Design system tests passed\n\n' +
              '---\n*Tested automatically by CI*';

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # ============================================
  # API integration tests (PRs and main)
  # NON-BLOCKING: Final verdict decides if this blocks
  # ============================================
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    # Run on both PRs and main branch
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check API key availability
        id: check-secrets
        run: |
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "has_api_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_api_key=false" >> $GITHUB_OUTPUT
            echo "⚠️ OPENROUTER_API_KEY not set - skipping API tests"
          fi

      - name: Run API integration tests
        if: steps.check-secrets.outputs.has_api_key == 'true'
        run: npm run test:api -- --reporter=json --outputFile=api-test-results.json || true
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_TEST_MODEL: ${{ secrets.OPENROUTER_TEST_MODEL }}
          TEST_API_DELAY_MS: '500'

      - name: Generate API test report
        if: steps.check-secrets.outputs.has_api_key == 'true'
        run: npx tsx scripts/api-test-reporter.ts || true
        continue-on-error: true

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-api
          path: .ai-reviews/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================
  # SQL Migration Validation
  # ============================================
  migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check SQL files exist
        run: |
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "✓ Found $(ls supabase/migrations/*.sql | wc -l) migration files"
          else
            echo "✓ No migration files to validate"
            exit 0
          fi

      - name: Validate SQL syntax
        run: |
          errors=0
          for file in supabase/migrations/*.sql; do
            if [ -f "$file" ]; then
              echo "Checking $file..."

              # Check for common dangerous patterns without IF EXISTS
              if grep -qiE "^\s*DROP\s+(TABLE|INDEX|FUNCTION|TRIGGER)\s+(?!IF\s+EXISTS)" "$file" 2>/dev/null; then
                echo "⚠️  Warning: $file has DROP without IF EXISTS"
              fi

              # Check for DELETE/TRUNCATE without WHERE (potential data loss)
              if grep -qiE "^\s*(DELETE\s+FROM|TRUNCATE)\s+\w+\s*;" "$file" 2>/dev/null; then
                echo "⚠️  Warning: $file has DELETE/TRUNCATE without WHERE clause"
              fi
            fi
          done

          echo "✓ Migration validation complete"

  # ============================================
  # FINAL VERDICT - The only job that can block PRs
  # ============================================
  final-verdict:
    name: 🎯 Final AI Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [migration-review, ai-code-review, visual-validation, e2e-preview, api-tests]
    if: github.event_name == 'pull_request' && always()
    # This job CAN fail and will block the PR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .ai-reviews directory
        run: mkdir -p .ai-reviews

      # Download all review artifacts using pattern matching
      - name: Download all review artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ai-reviews-*
          path: .ai-reviews-temp/
          merge-multiple: false

      # Flatten the directory structure (artifacts download to subdirectories)
      - name: Consolidate review artifacts
        run: |
          echo "📦 Consolidating review artifacts..."
          if [ -d ".ai-reviews-temp" ]; then
            # Each artifact downloads to its own subdirectory, flatten them
            find .ai-reviews-temp -name "*.json" -exec cp {} .ai-reviews/ \; 2>/dev/null || true
            echo "📄 Found review files:"
            ls -la .ai-reviews/ || echo "No review files found"
          else
            echo "⚠️ No review artifacts downloaded"
          fi

      - name: Get Vercel Preview URL
        id: vercel
        uses: zentered/vercel-preview-url@v1.1.9
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run final verdict
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_VERDICT_MODEL" ]; then
            echo "❌ OPENROUTER_VERDICT_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/ai-final-verdict.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VERDICT_MODEL: ${{ secrets.OPENROUTER_VERDICT_MODEL }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
          VERCEL_PREVIEW_URL: https://${{ steps.vercel.outputs.preview_url }}

      - name: Upload final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-verdict
          path: |
            .ai-reviews/final-verdict.json
            final-verdict-comment.md
          retention-days: 7

      - name: Post final verdict comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('final-verdict-comment.md')) {
              console.log('No final verdict comment to post')
              return
            }

            const comment = fs.readFileSync('final-verdict-comment.md', 'utf8')

            // Check for existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Final AI Verdict')
            )

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              })
            }
