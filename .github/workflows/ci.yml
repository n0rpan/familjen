name: AI-Powered CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # Run on all PRs to catch issues early
    types: [opened, synchronize, reopened]

# Required for posting PR comments
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Increase Node memory for TypeScript/Next.js builds
  NODE_OPTIONS: '--max-old-space-size=6144'

jobs:
  # ============================================
  # SMART TEST SELECTOR (runs first, decides what to test)
  # ============================================
  smart-selector:
    name: 🧠 Smart Test Selector
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Only run selector on PRs (push to main always runs protection tests)
    if: github.event_name == 'pull_request'
    outputs:
      run_visual: ${{ steps.selector.outputs.run_visual_validation }}
      run_e2e: ${{ steps.selector.outputs.run_e2e_tests }}
      run_migration: ${{ steps.selector.outputs.run_migration_review }}
      run_api: ${{ steps.selector.outputs.run_api_tests }}
      run_code_review: ${{ steps.selector.outputs.run_code_review }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Download previous PR state if exists
      - name: Download PR state artifact
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          workflow: ci.yml
          name: pr-state-${{ github.event.pull_request.number }}
          path: ci-state/
          search_artifacts: true

      - name: Run smart test selector
        id: selector
        run: npx tsx scripts/ai-test-selector.ts --base origin/${{ github.base_ref }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Upload PR state
        uses: actions/upload-artifact@v4
        with:
          name: pr-state-${{ github.event.pull_request.number }}
          path: ci-state/
          retention-days: 30

      - name: Upload test selection
        uses: actions/upload-artifact@v4
        with:
          name: test-selection
          path: ci-state/test-selection.json
          retention-days: 7

  # ============================================
  # MERGE CHECK - Skip CI if coming from green PR
  # ============================================
  merge-check:
    name: 🔍 Check Merge Status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      skip_ci: ${{ steps.check.outputs.skip_ci }}
      pr_number: ${{ steps.check.outputs.pr_number }}

    steps:
      - name: Check if from merged PR
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this push is from a merged PR
            // Handles: merge commits, squash merges, and rebase merges
            const commitMessage = context.payload.head_commit?.message || '';
            const commitSha = context.payload.head_commit?.id || '';

            // Pattern 1: Standard merge commit
            let prMatch = commitMessage.match(/Merge pull request #(\d+)/);

            // Pattern 2: Squash merge (PR title + number in parentheses)
            if (!prMatch) {
              prMatch = commitMessage.match(/\(#(\d+)\)$/m);
            }

            // Pattern 3: Check if commit is associated with a PR via GitHub API
            if (!prMatch && commitSha) {
              try {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: commitSha,
                });
                if (prs.length > 0 && prs[0].merged) {
                  prMatch = ['', prs[0].number.toString()];
                  console.log(`Found associated merged PR #${prs[0].number} via API`);
                }
              } catch (e) {
                console.log('Could not query associated PRs:', e.message);
              }
            }

            if (!prMatch) {
              console.log('Not a PR merge commit, running full CI');
              console.log('Commit message:', commitMessage.slice(0, 100));
              core.setOutput('skip_ci', 'false');
              return;
            }

            const prNumber = prMatch[1];
            core.setOutput('pr_number', prNumber);
            console.log(`Detected merge from PR #${prNumber}`);

            // Check if PR's CI passed
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: parseInt(prNumber),
              });

              // Get the final verdict check
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                check_name: '🎯 Final AI Verdict',
              });

              const verdictCheck = checks.check_runs[0];
              if (verdictCheck?.conclusion === 'success') {
                console.log('PR CI passed, skipping redundant checks');
                core.setOutput('skip_ci', 'true');
              } else {
                console.log('PR CI did not pass or verdict not found, running full CI');
                console.log('Verdict check:', JSON.stringify(verdictCheck, null, 2));
                core.setOutput('skip_ci', 'false');
              }
            } catch (error) {
              console.log('Could not check PR status:', error.message);
              core.setOutput('skip_ci', 'false');
            }

  # ============================================
  # STAGE 1: Fast checks (run in parallel)
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  # ============================================
  # STAGE 2: Unit tests (after lint/typecheck)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # NOTE: Build is done by Vercel - we rely on Vercel preview for build verification
  # This saves ~2min CI time since Vercel builds first anyway
  # ============================================

  # ============================================
  # AI Migration Review (for PRs with migrations)
  # NON-BLOCKING: Final verdict decides if this blocks
  # Uses smart selector output to determine if needed
  # ============================================
  migration-review:
    name: AI Migration Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, smart-selector]
    # Run if: selector says run OR selector didn't run (push to main) AND there are migrations
    if: |
      github.event_name == 'pull_request' &&
      (needs.smart-selector.outputs.run_migration == 'true' || needs.smart-selector.outputs.run_migration == '')
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check for migration changes
        id: check-migrations
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -c 'supabase/migrations/' || echo "0")
          echo "has_migrations=$([[ $CHANGED -gt 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "Found $CHANGED migration changes"

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      - name: Install dependencies
        if: steps.check-migrations.outputs.has_migrations == 'true'
        run: npm ci

      - name: Run AI migration review
        if: steps.check-migrations.outputs.has_migrations == 'true'
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_FAST_MODEL" ]; then
            echo "❌ OPENROUTER_FAST_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/migration-ai-review.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}

      - name: Write skipped status if no migrations
        if: steps.check-migrations.outputs.has_migrations != 'true'
        run: |
          echo '{"reviewer":"migration-review","status":"skipped","verdict":"PASS","confidence":100,"findings":[],"summary":"No migrations to review.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/migration-review.json

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-migration
          path: ai-reviews/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload legacy results
        if: steps.check-migrations.outputs.has_migrations == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: migration-review
          path: migration-review.json
          retention-days: 7

  # ============================================
  # AI Code Review
  # NON-BLOCKING: Final verdict decides if this blocks
  # ============================================
  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-tests]
    if: github.event_name == 'pull_request'
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      - name: Install dependencies
        run: npm ci

      - name: Run AI code review
        id: ai-review
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_FAST_MODEL" ]; then
            echo "❌ OPENROUTER_FAST_MODEL is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_CAPABLE_MODEL" ]; then
            echo "❌ OPENROUTER_CAPABLE_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/ai-code-review.ts --base origin/${{ github.base_ref }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}
          OPENROUTER_CAPABLE_MODEL: ${{ secrets.OPENROUTER_CAPABLE_MODEL }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Write fallback status if no code review
        if: always()
        run: |
          if [ ! -f "ai-reviews/code-review.json" ]; then
            echo '{"reviewer":"code-review","status":"failed","verdict":"ERROR","confidence":0,"findings":[{"severity":"critical","category":"runtime-error","message":"Code review script did not produce output"}],"summary":"Code review failed to run. Check CI logs.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/code-review.json
          fi

      - name: Debug - Show ai-reviews contents before upload
        if: always()
        run: |
          echo "📁 Contents of ai-reviews/ before upload:"
          ls -la ai-reviews/ || echo "(directory does not exist)"
          echo ""
          if [ -f "ai-reviews/code-review.json" ]; then
            echo "📄 code-review.json preview:"
            head -c 300 ai-reviews/code-review.json
          fi

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-code
          path: ai-reviews/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload legacy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-code-review
          path: |
            ai-review-result.json
            ai-review-comment.md
          retention-days: 7

      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('ai-review-comment.md')) {
              console.log('No review comment to post')
              return
            }

            const comment = fs.readFileSync('ai-review-comment.md', 'utf8')

            // Check for existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('AI Code Review')
            )

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              })
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              })
            }

  # ============================================
  # AI Visual Validation (No Baselines Needed)
  # ============================================
  visual-validation:
    name: AI Visual Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, smart-selector]
    # Run if: selector says run OR selector skipped it (let supervisor override)
    if: |
      github.event_name == 'pull_request' &&
      (needs.smart-selector.outputs.run_visual == 'true' || needs.smart-selector.outputs.run_visual == '')
    # Visual validation is advisory, not blocking. Reasons:
    # 1. New features may intentionally change UI (not a regression)
    # 2. AI vision models can have false positives
    # 3. Design decisions should be made by humans, AI just flags concerns
    # The PR comment will show issues for human review
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Get Vercel Preview URL
        id: vercel
        uses: zentered/vercel-preview-url@v1.1.9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Wait and retry if Vercel not ready
        id: vercel-wait
        if: steps.vercel.outputs.preview_url == ''
        run: |
          echo "⏳ Vercel preview not ready, waiting 30s and retrying..."
          sleep 30

      - name: Retry Get Vercel Preview URL
        id: vercel-retry
        if: steps.vercel.outputs.preview_url == ''
        uses: zentered/vercel-preview-url@v1.1.9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Set preview URL output
        id: preview
        run: |
          URL="${{ steps.vercel.outputs.preview_url || steps.vercel-retry.outputs.preview_url }}"
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: https://$URL"

      - name: Capture screenshots with mock data
        if: steps.preview.outputs.preview_url
        run: npx playwright test tests/e2e/capture-screenshots.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.preview.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Must match real Supabase URL so mock auth cookies have correct name
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Run AI visual validation
        if: steps.preview.outputs.preview_url
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_VISION_MODEL" ]; then
            echo "❌ OPENROUTER_VISION_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/ai-visual-validation.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VISION_MODEL: ${{ secrets.OPENROUTER_VISION_MODEL }}

      - name: Write skipped status if no preview URL
        if: steps.preview.outputs.preview_url == ''
        run: |
          echo '{"reviewer":"visual-validation","status":"skipped","verdict":"PASS","confidence":100,"findings":[],"summary":"No Vercel preview URL available.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/visual-validation.json

      - name: Write fallback status if no visual validation
        if: always()
        run: |
          if [ ! -f "ai-reviews/visual-validation.json" ]; then
            echo '{"reviewer":"visual-validation","status":"failed","verdict":"ERROR","confidence":0,"findings":[{"severity":"critical","category":"runtime-error","message":"Visual validation script did not produce output"}],"summary":"Visual validation failed to run. Check CI logs.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/visual-validation.json
          fi

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-visual
          path: ai-reviews/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload visual validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-validation
          path: |
            visual-validation-report.json
            visual-validation-comment.md
            tests/visual/current/
          retention-days: 7

      - name: Post visual validation comment
        if: always() && steps.preview.outputs.preview_url
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('visual-validation-comment.md')) {
              console.log('No visual validation comment to post')
              return
            }

            const comment = fs.readFileSync('visual-validation-comment.md', 'utf8')

            // Check for existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('AI Visual Validation')
            )

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              })
            }

  # ============================================
  # E2E Tests on Vercel Preview (PRs only)
  # ============================================
  e2e-preview:
    name: E2E Tests (Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, smart-selector]
    # Run if: selector says run OR let supervisor decide
    if: |
      github.event_name == 'pull_request' &&
      (needs.smart-selector.outputs.run_e2e == 'true' || needs.smart-selector.outputs.run_e2e == '')
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for PR diff comparison

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Get Vercel Preview URL
        id: vercel
        uses: zentered/vercel-preview-url@v1.1.9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Wait and retry if Vercel not ready
        if: steps.vercel.outputs.preview_url == ''
        run: |
          echo "⏳ Vercel preview not ready, waiting 30s and retrying..."
          sleep 30

      - name: Retry Get Vercel Preview URL
        id: vercel-retry
        if: steps.vercel.outputs.preview_url == ''
        uses: zentered/vercel-preview-url@v1.1.9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Set preview URL output
        id: preview
        run: |
          URL="${{ steps.vercel.outputs.preview_url || steps.vercel-retry.outputs.preview_url }}"
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: https://$URL"

      - name: Generate PR-specific test scenarios
        id: generate-tests
        if: steps.preview.outputs.preview_url
        continue-on-error: true
        run: npx tsx scripts/ai-pr-test-generator.ts --base origin/${{ github.base_ref }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Run E2E tests against preview
        id: e2e-tests
        if: steps.preview.outputs.preview_url
        continue-on-error: true  # Test failures shouldn't show job as red
        run: |
          # Run design system tests
          npx playwright test tests/e2e/design-system.spec.ts --project=chromium
          # Run language detection tests (Norwegian, English, Swedish)
          npx playwright test tests/e2e/language-detection.spec.ts --project=chromium
          # Run PR-specific generated tests (if they exist)
          if [ -f "tests/e2e/generated/pr-scenarios.json" ]; then
            echo "🤖 Running AI-generated PR-specific tests..."
            npx playwright test tests/e2e/pr-scenarios.spec.ts --project=chromium || true
          fi
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.preview.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Required for mock auth to create correct cookie name
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Capture screenshots from preview
        if: steps.preview.outputs.preview_url
        run: npx playwright test tests/e2e/capture-screenshots.spec.ts --project=chromium || true
        env:
          PLAYWRIGHT_BASE_URL: https://${{ steps.preview.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Generate E2E test report
        if: always()
        run: |
          # Convert Playwright results to review format
          npx tsx scripts/e2e-test-reporter.ts || true
        continue-on-error: true

      - name: Write fallback status if no e2e report
        if: always()
        run: |
          if [ ! -f "ai-reviews/e2e-tests.json" ]; then
            echo '{"reviewer":"e2e-tests","status":"skipped","verdict":"PASS","confidence":100,"findings":[],"summary":"E2E test reporter did not generate output.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/e2e-tests.json
          fi

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-e2e
          path: ai-reviews/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-preview-results
          path: |
            playwright-report/
            tests/visual/current/
            tests/e2e/generated/
          retention-days: 7

      - name: Post preview URL comment
        if: steps.preview.outputs.preview_url
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://${{ steps.preview.outputs.preview_url }}';
            const testOutcome = '${{ steps.e2e-tests.outcome }}';
            const testStatus = testOutcome === 'success'
              ? '✅ E2E tests passed'
              : testOutcome === 'failure'
                ? '⚠️ E2E tests had issues (see Final Verdict for details)'
                : '⏭️ E2E tests skipped';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );

            const body = '## 🔗 Preview Deployment\n\n' +
              '**URL:** ' + url + '\n\n' +
              '**Status:** ' + testStatus + '\n\n' +
              '---\n*Tested automatically by CI*';

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # ============================================
  # API integration tests (PRs and main)
  # NON-BLOCKING: Final verdict decides if this blocks
  # ============================================
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, smart-selector]
    # Run if: PR and selector says run, OR push to main (protection)
    # smart-selector only runs on PRs, but we need it in needs to access outputs
    # On main, smart-selector is skipped so outputs are empty, but we hit the push condition
    if: |
      always() &&
      needs.unit-tests.result == 'success' &&
      (
        (github.event_name == 'pull_request' &&
         needs.smart-selector.outputs.run_api != 'false') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    continue-on-error: true  # Non-blocking - final verdict decides

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      - name: Install dependencies
        run: npm ci

      - name: Check API key availability
        id: check-secrets
        run: |
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "has_api_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_api_key=false" >> $GITHUB_OUTPUT
            echo "⚠️ OPENROUTER_API_KEY not set - skipping API tests"
            # Write skipped status
            echo '{"reviewer":"api-tests","status":"skipped","verdict":"PASS","confidence":100,"findings":[],"summary":"API key not available.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/api-tests.json
          fi

      - name: Run API integration tests
        if: steps.check-secrets.outputs.has_api_key == 'true'
        run: npm run test:api -- --reporter=json --outputFile=api-test-results.json || true
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_TEST_MODEL: ${{ secrets.OPENROUTER_TEST_MODEL }}
          TEST_API_DELAY_MS: '500'

      - name: Generate API test report
        if: steps.check-secrets.outputs.has_api_key == 'true'
        run: npx tsx scripts/api-test-reporter.ts || true
        continue-on-error: true

      - name: Write fallback status if no api report
        if: always()
        run: |
          if [ ! -f "ai-reviews/api-tests.json" ]; then
            echo '{"reviewer":"api-tests","status":"skipped","verdict":"PASS","confidence":100,"findings":[],"summary":"API test reporter did not generate output.","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","model":"none","duration_ms":0}' > ai-reviews/api-tests.json
          fi

      - name: Upload review artifact for final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviews-api
          path: ai-reviews/
          retention-days: 7
          if-no-files-found: warn

  # ============================================
  # SQL Migration Validation
  # ============================================
  migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check SQL files exist
        run: |
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "✓ Found $(ls supabase/migrations/*.sql | wc -l) migration files"
          else
            echo "✓ No migration files to validate"
            exit 0
          fi

      - name: Validate SQL syntax
        run: |
          errors=0
          for file in supabase/migrations/*.sql; do
            if [ -f "$file" ]; then
              echo "Checking $file..."

              # Check for common dangerous patterns without IF EXISTS
              if grep -qiE "^\s*DROP\s+(TABLE|INDEX|FUNCTION|TRIGGER)\s+(?!IF\s+EXISTS)" "$file" 2>/dev/null; then
                echo "⚠️  Warning: $file has DROP without IF EXISTS"
              fi

              # Check for DELETE/TRUNCATE without WHERE (potential data loss)
              if grep -qiE "^\s*(DELETE\s+FROM|TRUNCATE)\s+\w+\s*;" "$file" 2>/dev/null; then
                echo "⚠️  Warning: $file has DELETE/TRUNCATE without WHERE clause"
              fi
            fi
          done

          echo "✓ Migration validation complete"

  # ============================================
  # FINAL VERDICT - The only job that can block PRs
  # ============================================
  final-verdict:
    name: 🎯 Final AI Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [migration-review, ai-code-review, visual-validation, e2e-preview, api-tests]
    if: github.event_name == 'pull_request' && always()
    # This job CAN fail and will block the PR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Download test selection from smart-selector (for supervisor tools)
      - name: Download test selection
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-selection
          path: ci-state/

      - name: Create ai-reviews directory
        run: mkdir -p ai-reviews

      # Download all review artifacts using pattern matching
      - name: Download all review artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ai-reviews-*
          path: ai-reviews-temp/
          merge-multiple: false

      # Flatten the directory structure (artifacts download to subdirectories)
      - name: Consolidate review artifacts
        run: |
          echo "📦 Consolidating review artifacts..."
          echo ""
          echo "🔍 Debug: Contents of ai-reviews-temp/"
          ls -laR ai-reviews-temp/ 2>/dev/null || echo "   (directory does not exist)"
          echo ""
          if [ -d "ai-reviews-temp" ]; then
            # Each artifact downloads to its own subdirectory, flatten them
            find ai-reviews-temp -name "*.json" -exec cp {} ai-reviews/ \; 2>/dev/null || true
            echo "📄 Found review files in ai-reviews/:"
            ls -la ai-reviews/ || echo "No review files found"
            echo ""
            echo "📄 Content preview of each file:"
            for f in ai-reviews/*.json; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                head -c 200 "$f"
                echo ""
              fi
            done
          else
            echo "⚠️ No review artifacts downloaded (ai-reviews-temp does not exist)"
          fi

      - name: Get Vercel Preview URL
        id: vercel
        uses: zentered/vercel-preview-url@v1.1.9
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run final verdict
        run: |
          # Validate required environment variables
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY is not set"
            exit 1
          fi
          if [ -z "$OPENROUTER_VERDICT_MODEL" ]; then
            echo "❌ OPENROUTER_VERDICT_MODEL is not set"
            exit 1
          fi
          npx tsx scripts/ai-final-verdict.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_VERDICT_MODEL: ${{ secrets.OPENROUTER_VERDICT_MODEL }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
          VERCEL_PREVIEW_URL: https://${{ steps.vercel.outputs.preview_url }}

      - name: Upload final verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-verdict
          path: |
            ai-reviews/final-verdict.json
            final-verdict-comment.md
            pre-existing-issues-comment.md
          retention-days: 7

      - name: Post final verdict comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('final-verdict-comment.md')) {
              console.log('No final verdict comment to post')
              return
            }

            const comment = fs.readFileSync('final-verdict-comment.md', 'utf8')

            // Check for existing bot comment (look for AI Review marker)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && (c.body.includes('AI Review:') || c.body.includes('Final AI Verdict'))
            )

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              })
            }

      - name: Post pre-existing issues comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('pre-existing-issues-comment.md')) {
              console.log('No pre-existing issues to report')
              return
            }

            const comment = fs.readFileSync('pre-existing-issues-comment.md', 'utf8')

            // Check for existing pre-existing issues comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Pre-existing Issues (Not from this PR)')
            )

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              })
            }
